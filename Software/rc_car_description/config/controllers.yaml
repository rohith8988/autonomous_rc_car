# Controllers for rc_car_description.
#
# The URDF exposes exactly three real DOFs (see its <ros2_control> block):
#   rear_axle_joint            velocity   the ONE traction DOF (solid axle)
#   front_left_steer_joint     position   independent kingpin
#   front_right_steer_joint    position   independent kingpin
#
# NOTE ON CONTROLLER CHOICE: ros2_control's ackermann_steering_controller
# expects TWO traction joints. This car has one (both rear wheels are bolted
# to a solid axle), so it does not fit. Rather than fake a second wheel, the
# joints are commanded directly here and the /cmd_vel -> (speed, steer) map
# is left to a vehicle node -- which is what the ESP32 firmware does on the
# real car anyway:
#     v      = linear.x                       [m/s]
#     delta  = atan(wheelbase * angular.z / v)          (Ackermann centre angle)
#     inner/outer = atan(L / (L/tan(delta) -/+ kingpin_width/2))
#     axle_rate   = v / wheel_radius          [rad/s]

controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    traction_controller:
      type: velocity_controllers/JointGroupVelocityController

    steering_controller:
      type: position_controllers/JointGroupPositionController

traction_controller:
  ros__parameters:
    joints: [rear_axle_joint]

steering_controller:
  ros__parameters:
    joints: [front_left_steer_joint, front_right_steer_joint]

# Vehicle geometry, single source of truth: tools/build_urdf.py emits the
# URDF from these same numbers.
#   wheelbase       0.258 m   rear axle (asm Y 138) to front axle (-120)
#   wheel_track     0.176 m   tyre centrelines
#   kingpin_width   0.140 m   measured pivot screws at asm X +-70, NOT the track
#   wheel_radius    0.033 m
vehicle_geometry:
  ros__parameters:
    wheelbase: 0.258
    wheel_track: 0.176
    kingpin_width: 0.140
    wheel_radius: 0.033
